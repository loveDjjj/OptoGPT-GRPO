device: auto

# 4 卡正式训练默认固定随机种子；各 rank 会在入口里自动叠加 rank_offset。
seed: 42

model:
  checkpoint_dir: outputs/our_work/pretrain/a100_4gpu

data:
  dataset_dir: outputs/our_work/data_gen/a100_4gpu
  train_split: train
  eval_split: val
  max_train_samples: null
  max_eval_samples: 1024
  num_workers: 4
  prefetch_factor: null
  pin_memory: true
  persistent_workers: false

training:
  output_dir: outputs/our_work/rl/a100_4gpu
  per_device_batch_size: 32
  gradient_accumulation_steps: 1
  epochs: 3
  learning_rate: 1.0e-5
  weight_decay: 0.0
  grad_clip_norm: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.01
  log_steps: 50
  eval_steps: 1000
  save_steps: 1000
  clip_epsilon: 0.2
  advantage_mode: zscore
  advantage_eps: 1.0e-6
  bf16: true

rollout:
  group_size: 4
  decode: sample
  temperature: 1.0
  top_k: 0
  top_p: 1.0
  max_new_tokens: 12
  batch_size: 128

scoring:
  batch_size: 256

reward:
  spectrum_metric: rt_rmse
  invalid_structure_penalty: 1.0
  tmm:
    database_path: our_work/_shared/database
    wavelength_range_um: [2.0, 15.0]
    num_points: 1024
    incident_angle: 0.0
    polarization: 0
    tolerance: 0.001
    complex_dtype: complex64
    batch_size: 128
    device: auto

distributed:
  backend: nccl
  timeout_minutes: 30
