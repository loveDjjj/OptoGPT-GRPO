experiment:
  name: eval_suite

paths:
  checkpoint_dir: outputs/our_work/pretrain/base_train
  dataset_dir: outputs/our_work/data_gen/v1
  database_dir: our_work/_shared/database
  output_dir: outputs/our_work/eval

data:
  splits: [train, val]
  sample_mode: random
  max_samples_per_split:
    train: 512
    val: 512
  seed: 42

inference:
  device: auto
  batch_size: 256
  max_new_tokens: 10

tmm:
  wavelength_range_um: [2.0, 15.0]
  num_points: 1024
  incident_angle: 0.0
  polarization: 0
  tolerance: 0.001
  complex_dtype: complex128
  batch_size: 512
  device: auto

plots:
  enable: true
  worst_count: 8
  best_count: 8
  mean_count: 8
  save_histograms: true
  save_split_comparison: true
  save_sample_plots: true

outputs:
  save_jsonl: true
  save_summary_json: true
  save_split_summary_json: true
  save_selected_samples_json: true
  save_spectra_in_results: false
