seed: 42

paths:
  # 相对路径会由入口脚本固定解析到仓库根目录，避免依赖启动时的 cwd。
  database_dir: database
  # 默认按单卡 A100 80G 输出到仓库根下统一 outputs 目录；多卡可改用 a100_4gpu/a100_8gpu.yaml。
  output_dir: outputs/our_work/data_gen/v1

data:
  # 正式数据默认覆盖 5-10 层，共 6 个 bucket。
  layer_counts: [5, 6, 7, 8, 9, 10]
  # 每个 bucket 默认 50w，总计约 300w 条结构-光谱样本。
  samples_per_bucket: 500000
  # 厚度离散规则：10nm 到 500nm，步长 10nm，包含两端点。
  thickness_range_nm:
    min: 10
    max: 500
    step: 10

sampling:
  # 单卡默认用 `auto`；多卡时会按各 rank 自动解析到对应 cuda:<local_rank>。
  device: auto
  # 单卡 A100 80G 默认候选采样 batch。
  # 多卡可参考 a100_4gpu.yaml / a100_8gpu.yaml 保持或上调。
  batch_size: 65536
  # 若连续多轮补采仍几乎全部重复，达到该上限后直接报错。
  max_duplicate_retry: 1000

tmm:
  wavelength_range_um: [2.0, 15.0]
  # 1024 个波长点会生成 2048 维的 [R..., T...] 输入；若修改这里，训练模型的
  # model.spectrum_dim 必须同步改为 2 * num_points。
  num_points: 1024
  incident_angle: 0.0
  polarization: 0
  tolerance: 0.001
  # 单卡默认保守使用 complex128；多卡吞吐优先时可切到 complex64。
  complex_dtype: complex128
  device: auto
  # 当前机器为单卡 A100 + 16 CPU，因此默认把 CPU 辅助线程固定到 16。
  # 多卡时请按每卡 CPU 重新分配，例如 4 卡/64 CPU 可继续用 16。
  cpu_threads: 16
  # 单卡 A100 80G 默认 TMM chunk；多卡吞吐优先可参考 a100_4gpu/a100_8gpu.yaml。
  batch_size: 4096

distributed:
  # 默认单卡关闭分布式；多卡请改为 true，或直接使用 a100_4gpu/a100_8gpu.yaml。
  enabled: false
  timeout_minutes: 30
  # 当前先按 layer bucket 在 rank 间 round-robin 分配，保证 bucket 内全局唯一不跨 rank 破坏。
  shard_mode: layer_bucket

shards:
  # 正式生成默认每 5w 条写一个 parquet shard，便于服务器分片搬运与读取。
  records_per_shard: 50000

splits:
  train_ratio: 0.9
  val_ratio: 0.1

logging:
  # 数据生成阶段按 layer bucket 显示 tqdm 进度条。
  show_progress_bar: true

analysis:
  enabled: true
  auto_after_build: true
  output_dir: null
  batch_size: 8192
  scopes: [all]
  structure:
    enabled: true
  spectrum:
    enabled: true
    device: auto
    engine: rapids
    pca_components: 8
    pca_fit_samples: 50000
    cluster_count: 16
    cluster_fit_samples: 50000
    cluster_iterations: 20
    scatter_max_points: 20000
    save_split_analysis: false
