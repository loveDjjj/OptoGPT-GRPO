seed: 42

paths:
  # 相对路径会由入口脚本固定解析到仓库根目录，避免依赖启动时的 cwd。
  database_dir: database
  # 服务器默认输出到仓库根下的统一 outputs 目录；如需落到数据盘，可改绝对路径。
  output_dir: outputs/our_work/data_gen/v1

data:
  # 正式数据默认覆盖 5-10 层，共 6 个 bucket。
  layer_counts: [5, 6, 7, 8, 9, 10]
  # 每个 bucket 默认 50w，总计约 300w 条结构-光谱样本。
  samples_per_bucket: 500000
  # 厚度离散规则：10nm 到 500nm，步长 10nm，包含两端点。
  thickness_range_nm:
    min: 10
    max: 500
    step: 10

sampling:
  # 候选结构采样设备；`auto` 会在有 CUDA 时优先使用 GPU。
  device: auto
  # 单次 GPU 采样的候选结构数量。
  batch_size: 65536
  # 若连续多轮补采仍几乎全部重复，达到该上限后直接报错。
  max_duplicate_retry: 1000

tmm:
  wavelength_range_um: [2.0, 15.0]
  # 1024 个波长点会生成 2048 维的 [R..., T...] 输入；若修改这里，训练模型的
  # model.spectrum_dim 必须同步改为 2 * num_points。
  num_points: 1024
  incident_angle: 0.0
  polarization: 0
  tolerance: 0.001
  complex_dtype: complex128
  # 单次送入 TMM 的结构数量；正式生成时按 chunk 分批跑，避免整 bucket 一次性占满显存/内存。
  batch_size: 2048

shards:
  # 正式生成默认每 5w 条写一个 parquet shard，便于服务器分片搬运与读取。
  records_per_shard: 50000

splits:
  train_ratio: 0.9
  val_ratio: 0.1

logging:
  # 数据生成阶段按 layer bucket 显示 tqdm 进度条。
  show_progress_bar: true
