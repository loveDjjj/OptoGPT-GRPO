model:
  # 必须与 data_gen 侧的 2 * tmm.num_points 保持一致；默认 1024 点 => 2048 维 [R..., T...]。
  spectrum_dim: 2048
  prefix_length: 8
  n_positions: 32
  # 调整到 1024 hidden，配合 8 个 spectrum prefix tokens 使用更强的 decoder 容量。
  n_embd: 1024
  n_layer: 6
  # 1024 / 16 = 64，每个 attention head 维度是标准的 64。
  n_head: 16
