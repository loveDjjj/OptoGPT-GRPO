data:
  # 默认是单卡 A100 80G 的基础配置；4卡/8卡请改用 a100_4gpu.yaml / a100_8gpu.yaml。
  dataset_dir: outputs/our_work/data_gen/v1
  vocab_path: outputs/our_work/data_gen/v1/vocab/vocab.json
  # 单卡 A100 + 16 CPU 默认给 dataloader 8 个 worker，避免和主进程争抢过多 CPU。
  num_workers: 8
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true

training:
  # 单卡默认输出目录；多卡请改用单独 run 目录，避免和其他配置混淆。
  output_dir: outputs/our_work/pretrain/base_train
  # 单卡 A100 80G 默认每卡 batch 调到 16。
  per_device_train_batch_size: 16
  # 验证阶段不做反向传播，默认把单卡 eval batch 提高到 64，减少完整 val 扫描所需的 batch 数。
  per_device_eval_batch_size: 64
  # 单卡默认保留适度梯度累积，方便后续无缝切多卡。
  gradient_accumulation_steps: 2
  num_train_epochs: 5
  # 正式训练默认由 epoch 控制；若要快速 smoke，可临时改成小整数。
  max_steps: null
  # 针对默认 1024/6/16 模型配置，默认学习率下调到 1e-4，减少从 7M 级别放大到接近 1e8 参数后的训练不稳定风险。
  learning_rate: 1.0e-4
  # 单卡 A100 默认直接打开 bf16 / tf32；若做数值诊断再手动关闭。
  bf16: true
  tf32: true
  # 正式训练默认每 1000 个 optimizer step 记录一次日志，避免在 42 万步总训练里刷出过密日志。
  logging_steps: 1000
  # 全量 val 约 30 万条样本，完整评估一次代价很高；默认每 10 万步做一次全量评估，避免验证阶段吞掉大部分训练时间。
  eval_steps: 100000
  # checkpoint 默认每 5 万步保存一次，既保留恢复点，也不让保存频率和昂贵评估完全绑死。
  save_steps: 50000
  save_total_limit: 3

distributed:
  # 单卡不会实际用到 DDP，这里保留多卡参数是为了后续切 4/8 卡时直接复用。
  backend: nccl
  ddp_find_unused_parameters: false

monitoring:
  # 训练过程中默认把标量写到 TensorBoard，便于实时查看。
  tensorboard: true
  # 训练/验证指标持续追加到 JSONL，便于恢复和二次分析。
  jsonl: true
  # 同步维护 CSV，方便直接用表格或脚本查看。
  csv: true
  # 训练结束后以及每次验证后自动更新 PNG 曲线图。
  save_plots: true
  # 每次 eval 后更新一轮 PNG，总览图不会等到最后才出现。
  plot_every_eval: true
  # TensorBoard writer 的默认 flush 周期，单位秒。
  flush_secs: 10
