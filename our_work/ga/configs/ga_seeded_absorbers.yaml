# GA seeded 吸收结构补充数据集配置
# 目标：从 3 个已知优秀结构出发，利用遗传算法在固定预算内持续搜索，
# 保留满足最低质量要求的样本，并用更优新样本替换当前较差样本。

seed: 42

paths:
  # 材料库目录。与主数据生成链路保持一致。
  database_dir: our_work/_shared/database
  # GA 补充数据集单独输出，避免覆盖主数据集。
  output_dir: outputs/our_work/data_gen/ga_seeded_absorbers

# 默认不写 materials，表示使用 database_dir 下全部材料。
# 如果只想围绕已知优秀解附近搜索，也可以手动限制材料集合：
# materials: [Au, Bi, Ge, MgF2, Si, SiO2, YbF3, ZnS]

data:
  # 每个 target 最终最多保留多少条样本。
  # 搜索不会因为达到这个数量而提前停止；池满后会继续用更优样本替换更差样本。
  max_samples_per_target: 100
  # 主模型厚度约束：所有后续 GA 候选都只在这个合法厚度网格上搜索。
  thickness_range_nm:
    min: 10
    max: 500
    step: 10
  # 是否把“预处理后的 seed 厚度值”并入搜索厚度集合。
  # 注意：这里不会再把 820/850/870 这种非法厚度放回搜索空间。
  include_seed_thickness_values: true
  # 补充数据默认全部写入 train；如需单独留验证集，再调整比例。
  train_ratio: 1.0
  val_ratio: 0.0

targets:
  # null 表示运行默认 3 个 seeded target。
  # 如果只想单独跑一个或几个，就写成列表，例如：
  # include_ids: [broad_3_13_high]
  include_ids: null

search:
  # 种群规模。越大越能提高并行度，但单代显存和耗时也更高。
  population_size: 8192
  # 每个随机重启固定运行多少代。
  generations_per_restart: 20
  # 固定运行多少个随机重启。
  restart_count: 5
  # 每次送入 TMM evaluator 的结构数，主要控制 GPU 并行度与显存占用。
  batch_size: 8192
  # 最低接收门槛。低于这个门槛的样本才进入候选池竞争；
  # 这不是“达到阈值就停”的条件。
  acceptance_floor_mse: 0.005
  # 精英保留比例。
  elite_fraction: 0.15
  # 锦标赛选择规模。
  tournament_size: 4
  # 固定层数下的逐层均匀交叉概率。
  crossover_rate: 0.8
  # 材料变异概率。
  material_mutation_rate: 0.05
  # 厚度变异概率。
  thickness_mutation_rate: 0.35
  # 厚度变异的最大步数，单位是 thickness_values_nm 的索引步长，不是 nm。
  thickness_mutation_steps: 6
  # 每代随机注入比例，用于避免过早收敛。
  random_injection_rate: 0.08
  # auto 会优先尝试 CUDA；多进程时脚本会按 LOCAL_RANK 绑定 cuda:<rank>。
  device: auto

tmm:
  # 与主数据生成保持一致：2-15 um，1024 点，最终模型输入是 [R..., T...] 共 2048 维。
  wavelength_range_um: [2.0, 15.0]
  num_points: 1024
  incident_angle: 0.0
  polarization: 0
  tolerance: 0.001
  complex_dtype: complex128
  # TMM 内部批大小。显存不够时优先下调这里。
  batch_size: 4096
  device: auto

shards:
  # 单个 parquet shard 的最大记录数。
  records_per_shard: 50000

visualization:
  # 输出每个 target 的 accepted absorption top-k 叠加图和 MSE 分布图。
  enabled: true
  top_k: 20

distributed:
  # 这里只做 target 级拆分，不是 DDP 训练。
  # 例如 torchrun --nproc_per_node=3 时，3 个 rank 各负责一个 target。
  enabled: false
