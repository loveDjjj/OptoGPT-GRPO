# 2-25 um 六波段 PSO 补充数据集配置。
# 目标波段依次为 2-3、3-5、5-8、8-13、13-16、16-25 um。

seed: 42

paths:
  # 这里的 17 种材料均使用覆盖完整 2-25 um 的 nk 表，来源见数据库目录下 SOURCES_2_25.md。
  database_dir: our_work/_shared/database
  output_dir: outputs/our_work/data_gen/pso_2_25_binary_bands

# 仅允许具有完整 2-25 um 数据覆盖的材料参与搜索；不要删除此限制后直接运行。
materials:
  - Ag
  - Al
  - Al2O3
  - Au
  - Cr
  - Cu
  - HfO2
  - MgF2
  - MgO
  - Si
  - SiO2
  - Ta2O5
  - Ti
  - TiO2
  - VO2
  - ZnO
  - ZnS

data:
  # 保持 5-10 层，同时把单层厚度扩展到 1000 nm；20 nm 步长仍保留约 50 个离散厚度值。
  layer_counts: [5, 6, 7, 8, 9, 10]
  thickness_range_nm:
    min: 20
    max: 1000
    step: 20
  train_ratio: 1.0
  val_ratio: 0.0

targets:
  # 新配置只生成六波段二元组合，不混入旧固定目标或 Lorentzian 目标。
  include_fixed: false
  include_lorentzian: false
  binary_bands:
    enabled: true
    family: binary_band_2_25
    edges_um: [2.0, 3.0, 5.0, 8.0, 13.0, 16.0, 25.0]
    # 仅保留相邻高低状态最多变化两次的组合，并移除信息量较低的全低目标，共 31 个任务。
    max_transitions: 2
    exclude_all_low: true
  max_targets: null
  include_ids: null

search:
  # 用更大的单轮种群扩大并行探索广度，同时减少迭代与 restart 以缩短总运行时间。
  population_size: 16384
  iterations: 8
  # A100 80G 默认一次处理完整种群；显存不足时优先降到 8192，不需要减小 population_size。
  batch_size: 16384
  max_accepted_per_target_layer: 50
  # 略微放宽接收阈值，减少困难目标长期没有 accepted 样本的概率。
  acceptance_mse_threshold: 0.015
  max_stagnant_iterations: 3
  max_restarts: 2
  inertia: 0.7
  cognitive: 1.5
  social: 1.5
  device: auto

tmm:
  # 保持 1024 个采样点，因此每条输出仍为 2048 维 [R..., T...]；波长语义已变为 2-25 um。
  wavelength_range_um: [2.0, 25.0]
  num_points: 1024
  incident_angle: 0.0
  polarization: 0
  tolerance: 0.001
  complex_dtype: complex128
  # 与搜索 batch 对齐以提高 A100 80G 吞吐；OOM 时可独立降到 8192。
  batch_size: 16384
  device: auto

shards:
  records_per_shard: 50000

visualization:
  # 搜索结束后为每个目标回算全局最佳候选，并保存 R/T/A 光谱、层结构表和 JSON。
  enabled: true
  output_subdir: plots/best_targets
  dpi: 220
  include_rt: true

distributed:
  # 多进程仅按 target/layer work item 拆分，不执行 DDP。
  enabled: false
