# GA 吸收结构补充数据集配置
# 该配置直接使用同一个 GA 主入口，并把默认 3 个 seeded 任务显式写成 targets.tasks。
seed: 42

paths:
  # 材料库目录。与主数据生成链路保持一致。
  database_dir: _shared/database
  # GA 补充数据集单独输出，避免覆盖主数据集。
  output_dir: outputs/our_work/data_gen/ga_seeded_absorbers

# 默认不写 materials，表示使用 database_dir 下全部材料。
# 如需限制搜索材料集合，可手动指定，例如：
# materials: [Au, Bi, Ge, MgF2, Si, SiO2, YbF3, ZnS]

data:
  # 每个任务最终最多保留多少条样本。
  # 搜索不会因为达到这个数量而提前停；池满后会继续用更优样本替换较差样本。
  max_samples_per_target: 100
  # 主模型厚度约束。后续 GA 搜索只在这个合法厚度网格内进行。
  thickness_range_nm:
    min: 10
    max: 500
    step: 10
  # 是否把“初始 seed 经过拆分后的合法厚度值”并入厚度集合。
  # 对当前 10-500、步长 10 的网格而言，这通常不会引入新厚度，只是显式保留兼容语义。
  include_seed_thickness_values: true
  # 生成的数据默认全部写入 train；如需留验证集，再调整比例。
  train_ratio: 1.0
  val_ratio: 0.0

targets:
  # 同一个主入口支持用户自定义任务列表。这里把默认 3 个 seeded 任务显式写出来。
  # 未在 bands 中声明的波段不会进入 loss 计算。
  tasks:
    - target_id: broad_3_13_high
      family: seeded_band
      description: 3-13 um 高吸收；其他波段不参与损失。
      bands:
        - start_um: 3.0
          end_um: 13.0
          absorption: 1.0
      # 给了参考初始结构时，会先检查并拆分 >500 nm 的层，再进入 GA。
      seed_tokens: [YbF3_870, ZnS_480, Si_280, Bi_20, Ge_130, Bi_820, Au_100]

    - target_id: mid_5_8_high
      family: seeded_band
      description: 3-5 低吸收、5-8 高吸收、8-13 低吸收；其他波段不参与损失。
      bands:
        - start_um: 3.0
          end_um: 5.0
          absorption: 0.0
        - start_um: 5.0
          end_um: 8.0
          absorption: 1.0
        - start_um: 8.0
          end_um: 13.0
          absorption: 0.0
      seed_tokens: [Si_250, SiO2_120, Ge_500, MgF2_850, Ge_110, MgF2_500, Bi_130, Au_100]

    - target_id: dual_3_5_8_13_high
      family: seeded_band
      description: 3-5 高吸收、5-8 低吸收、8-13 高吸收；其他波段不参与损失。
      bands:
        - start_um: 3.0
          end_um: 5.0
          absorption: 1.0
        - start_um: 5.0
          end_um: 8.0
          absorption: 0.0
        - start_um: 8.0
          end_um: 13.0
          absorption: 1.0
      seed_tokens: [SiO2_150, MgF2_500, Si_500, ZnS_450, Ge_490, MgF2_280, Si_320, Bi_250, Au_100]

  # 可选。只想跑部分任务时，用 target_id 过滤上面的 tasks。
  # include_ids: [broad_3_13_high]
  include_ids: null

search:
  # 种群规模。越大越能提高并行度，但单代显存和耗时也更高。
  population_size: 8192
  # 每个随机重启固定运行多少代。
  generations_per_restart: 30
  # 固定运行多少个随机重启。
  restart_count: 5
  # 每次送入 TMM evaluator 的结构数，用于控制 GPU 并行度与显存占用。
  batch_size: 8192
  # 最低接收门槛。低于这个门槛的样本才进入候选池竞争。
  acceptance_floor_mse: 0.005
  elite_fraction: 0.15
  tournament_size: 4
  crossover_rate: 0.8
  material_mutation_rate: 0.05
  thickness_mutation_rate: 0.35
  # 厚度变异的最大步数，单位是 thickness_values_nm 的索引步长，不是 nm。
  thickness_mutation_steps: 6
  # 每代随机注入比例，用于避免过早收敛。
  random_injection_rate: 0.08
  # auto 会优先尝试 CUDA；多进程时脚本会按 LOCAL_RANK 绑定 cuda:<rank>。
  device: auto

tmm:
  # 与主数据生成保持一致：2-15 um，1024 点，模型输入为 [R..., T...] 共 2048 维。
  wavelength_range_um: [2.0, 15.0]
  num_points: 1024
  incident_angle: 0.0
  polarization: 0
  tolerance: 0.001
  complex_dtype: complex128
  # TMM 内部批大小。显存不够时优先下调这里。
  batch_size: 8192
  device: auto

shards:
  # 单个 parquet shard 的最大记录数。
  records_per_shard: 50000

visualization:
  # 输出每个任务的 accepted absorption top-k 叠加图和 MSE 分布图。
  enabled: true
  top_k: 20

distributed:
  # 这里只做 target 级拆分，不是 DDP 训练。
  # 例如 torchrun --nproc_per_node=3 时，3 个 rank 各负责一个任务。
  enabled: false
